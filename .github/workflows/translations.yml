# Publishes this app's own default layer — the key set every translation is measured
# against. The managed and tenant seed layers under seed/ are NOT published here: they are
# gated on an Extenda IAM grant that no CI service account holds. See
# scripts/publish-seed-layers.sh.
name: Translations

# Deliberately not filtered on `translations/**`. Publishing is part of what a deploy
# does here, so every push to master republishes the default layer and every pull request
# reports what a real run would do.
#
# This costs nothing when the wording has not changed: the action reads the published file
# first and skips a publish that would change nothing, precisely so a pipeline running on
# every release does not invalidate every client's cached copy. The read-back below then
# proves on every single deploy that the copy the app serves is the copy this repository
# published.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  MODULE_ID: trs-demo-app
  TRANSLATIONS_PATH: translations/

jobs:
  # A pull request only validates: it reports whether a real run would publish or skip.
  #
  # Skipped for a pull request from a fork. This repository is public, and GitHub withholds
  # secrets from a fork's workflow run, so the action would have no credential to
  # authenticate with and the job would fail on every such pull request. A skipped job says
  # "not checked here" honestly; a red one would say the file is unpublishable, which is a
  # different claim and not one this run is in a position to make.
  dry-run:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: extenda/actions/translations@v0
        with:
          service-account-key: ${{ secrets.GCLOUD_AUTH_STAGING }}
          module-id: ${{ env.MODULE_ID }}
          path: ${{ env.TRANSLATIONS_PATH }}
          environment: staging
          dry-run: 'true'

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include:
          - environment: staging
            host: https://translation.retailsvc.dev
          - environment: prod
            host: https://translation.retailsvc.com
    steps:
      - uses: actions/checkout@v7

      - uses: extenda/actions/translations@v0
        with:
          service-account-key: ${{ matrix.environment == 'prod' && secrets.GCLOUD_AUTH_PROD || secrets.GCLOUD_AUTH_STAGING }}
          module-id: ${{ env.MODULE_ID }}
          path: ${{ env.TRANSLATIONS_PATH }}
          environment: ${{ matrix.environment }}

      - name: Read the module back anonymously
        run: |
          body=$(curl -sf "${{ matrix.host }}/api/v1/modules/${{ env.MODULE_ID }}/translations/en-US")
          echo "$body" | jq .
          echo "$body" | jq -e '.layer == "resolved"' > /dev/null
          echo "$body" | jq -e '.entries["cart.count"] | contains("plural")' > /dev/null
